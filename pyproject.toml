[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.pytest.ini_options]
# Rendre `app` et `scripts` importables quel que soit l'invocation de pytest
# (nécessaire sous `uv run pytest`, qui n'ajoute pas le cwd au sys.path).
pythonpath = ["."]
testpaths = ["tests"]