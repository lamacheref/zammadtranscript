name: CI/CD (Gitea)

# Workflow spécifique à Gitea. Dès que .gitea/workflows/ existe, Gitea
# ignore .github/workflows/ (pas de double exécution).
# Différence clé avec GitHub : le runner est bare-metal (Debian 13) et
# actions/setup-python échoue ("Cannot find: node in PATH"). On utilise UV
# (déjà installé sur le runner) pour gérer Python 3.12 et les dépendances.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    # Adapter ce label à celui enregistré pour votre runner act_runner.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python with UV
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.12
          uv venv --python 3.12

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio

      - name: Lint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check app/ scripts/ tests/
          uv run ruff format --check app/ scripts/ tests/

      - name: Run tests with coverage
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest --cov=app --cov-fail-under=80 --cov-report=term-missing tests/ -v

  version:
    name: Bump version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          before=$(cat VERSION)
          new_version=$(python3 scripts/bump_version.py --write)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "new=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        # N'exécuter que si la version a changé ET qu'aucun tag vX.Y.Z ne correspond déjà
        # (évite l'échec 'tag already exists' quand le CI tourne en parallèle sur 2 forges)
        if: steps.bump.outputs.before != steps.bump.outputs.new
        run: |
          set -e
          if git rev-parse -q --verify "refs/tags/v${{ steps.bump.outputs.new }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.bump.outputs.new }} existe déjà, skip."
            exit 0
          fi
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea.smiden.eu"
          git add VERSION
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new }}"
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin "HEAD:main"
          git push origin "v${{ steps.bump.outputs.new }}"

  build:
    name: Build and push Docker image
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python with UV
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.12
          uv venv --python 3.12

      - name: Compute version
        id: version
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "VERSION=$(uv run python scripts/bump_version.py)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine registry
        id: registry
        run: |
          server="${{ github.server_url }}"
          echo "registry=${server#https://}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        # Le GITHUB_TOKEN de Gitea Actions est refusé au push (reqPackageAccess) :
        # créer un secret REGISTRY_TOKEN = PAT Gitea avec l'accès "write:package".
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (staging)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Determine registry
        id: registry
        run: |
          server="${{ github.server_url }}"
          echo "registry=${server#https://}" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        run: |
          echo "Deploy to staging server via SSH or orchestration tool"
          echo "Image: ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:latest"