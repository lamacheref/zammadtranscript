version: "3.9"

services:
  zammad-autotranscription:
    build:
      context: .
      dockerfile: Dockerfile
    image: zammad-autotranscription:latest
    container_name: zammad-autotranscription
    restart: unless-stopped
    environment:
      - ZAMMAD_URL=http://zammad:8080
      - ZAMMAD_TOKEN=${ZAMMAD_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - REDIS_URL=redis://redis:6379
      - RQ_QUEUE_NAME=transcription
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_CPU_THREADS=4
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./app/_data:/app/_data
      - ./.hf-cache:/app/.hf-cache
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - redis
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  zammad-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: zammad-autotranscription:latest
    container_name: zammad-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      - ZAMMAD_URL=http://zammad:8080
      - ZAMMAD_TOKEN=${ZAMMAD_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - REDIS_URL=redis://redis:6379
      - RQ_QUEUE_NAME=transcription
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_CPU_THREADS=4
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    volumes:
      - ./app/_data:/app/_data
      - ./.hf-cache:/app/.hf-cache
    depends_on:
      - ollama
      - redis

  redis:
    image: redis:7-alpine
    container_name: zammad-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: zammad-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
  redis_data: