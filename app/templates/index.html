<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zammad Auto-Transcription</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: #2c3e50; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #666; font-size: 1.1rem; }
        .models { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }
        .model-chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; border: 1px solid transparent; cursor: help; }
        .model-chip .ico { font-weight: 700; }
        .model-chip.ok { background: #e8f8f5; color: #1e8449; border-color: #aee6c8; }
        .model-chip.ok .ico { color: #27ae60; }
        .model-chip.warning { background: #fef9e7; color: #8a6d3b; border-color: #f7dc6f; }
        .model-chip.warning .ico { color: #f1c40f; }
        .model-chip.error { background: #fdf2f2; color: #c0392b; border-color: #f0b4b4; }
        .model-chip.error .ico { color: #e74c3c; }
        .model-refresh { background: none; border: none; color: #aaa; cursor: pointer; font-size: 0.9rem; }
        .model-refresh:hover { color: #3498db; }
        .model-chip.btn { cursor: pointer; border-color: #aed6f1; background: #eaf2f8; color: #1a5276; }
        .model-chip.btn:hover { background: #d4e6f1; }
        .model-chip.btn:disabled { opacity: 0.6; cursor: wait; }
        .model-chip.downloading { cursor: default; flex-direction: column; align-items: stretch; min-width: 230px; background: #ebf5fb; color: #2c3e50; border-color: #3498db; }
        .model-chip.downloading .dl-top { display: flex; align-items: center; gap: 0.4rem; }
        .model-chip.downloading .progress-text { font-variant-numeric: tabular-nums; }
        .progress-bar { display: block; height: 6px; background: #dfe6ea; border-radius: 3px; overflow: hidden; margin-top: 0.35rem; }
        .progress-bar > span { display: block; height: 100%; background: #3498db; transition: width 0.3s; }
        .card { background: white; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #2c3e50; }
        input[type="number"] { width: 100%; padding: 0.75rem; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; transition: border-color 0.2s; }
        input[type="number"]:focus { outline: none; border-color: #3498db; }
        .btn { width: 100%; padding: 0.875rem; background: #3498db; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #2980b9; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }

        .result { margin-top: 1.5rem; display: none; }
        .result.active { display: block; }
        .result h3 { margin-bottom: 0.75rem; }

        .steps { margin: 1rem 0; }
        .step { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 6px; margin-bottom: 0.5rem; border: 1px solid #eee; background: #fafafa; }
        .step .icon { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: white; margin-top: 2px; }
        .step .body { flex: 1; min-width: 0; }
        .step .label { font-weight: 600; }
        .step .message { font-size: 0.85rem; color: #666; }
        .step .error { font-size: 0.85rem; color: #c0392b; word-break: break-word; }
        .step.pending .icon { background: #bdc3c7; }
        .step.running .icon { background: #3498db; animation: pulse 1s infinite alternate; }
        .step.running { border-color: #3498db; background: #ebf5fb; }
        .step.ok .icon { background: #27ae60; }
        .step.ok { border-color: #aee6c8; background: #e8f8f5; }
        .step.error-st .icon { background: #e74c3c; }
        .step.error-st { border-color: #f0b4b4; background: #fdf2f2; }
        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

        .success-box { background: #e8f8f5; border: 1px solid #27ae60; border-radius: 6px; padding: 1rem; margin-top: 1rem; }
        .error-box { background: #fdf2f2; border: 1px solid #e74c3c; border-radius: 6px; padding: 1rem; margin-top: 1rem; }
        .success-box h3 { color: #27ae60; }
        .error-box h3 { color: #e74c3c; }
        .success-box pre, .error-box pre { background: #f8f9fa; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.9rem; max-height: 300px; }
        .detail { margin: 0.35rem 0; }
        a { color: #2980b9; }
        .health { text-align: right; margin-top: 2rem; font-size: 0.85rem; color: #888; }
        .health span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem; vertical-align: middle; }
        .health.ok span { background: #27ae60; }
        .health.error span { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ Zammad Auto-Transcription</h1>
            <p class="subtitle">Transcription manuelle de messages vocaux</p>
            <div class="models" id="models-bar">
                <span class="model-chip"><span class="ico">…</span> Vérification des modèles…</span>
            </div>
        </header>

        <div class="card">
            <form id="transcribe-form" novalidate>
                <div class="form-group">
                    <label for="ticket_id">Numéro de ticket Zammad (ID interne ou n° 2026...) </label>
                    <input type="number" id="ticket_id" name="ticket_id" min="1" required placeholder="ex: 6475 ou 202608069400166" autocomplete="off">
                </div>
                <button type="submit" class="btn" id="submit-btn">Lancer la transcription</button>
            </form>

            <div id="result" class="result">
                <h3 id="result-title"></h3>
                <div id="steps-container" class="steps"></div>
                <div id="details-container"></div>
            </div>
        </div>

        <div class="health">
            API: <span id="health-status" class="error"></span><span id="health-text">Vérification...</span>
        </div>
    </div>

    <script>
        const STEP_ORDER = ['ticket', 'article', 'download', 'transcription'];
        const STEP_LABELS = {
            'ticket': 'Recherche du ticket',
            'article': "Recherche de l'article contenant l'audio",
            'download': "Téléchargement de l'audio",
            'transcription': 'Transcription'
        };

        const form = document.getElementById('transcribe-form');
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submit-btn');
        const resultTitle = document.getElementById('result-title');
        const stepsContainer = document.getElementById('steps-container');
        const detailsContainer = document.getElementById('details-container');
        const modelsBar = document.getElementById('models-bar');
        const healthSpan = document.getElementById('health-status');
        const healthText = document.getElementById('health-text');

        async function checkHealth() {
            try {
                const res = await fetch('/health');
                if (res.ok) {
                    healthSpan.className = 'ok';
                    healthText.textContent = 'Opérationnel';
                } else { throw new Error('API down'); }
            } catch {
                healthSpan.className = 'error';
                healthText.textContent = 'Indisponible';
            }
        }
        checkHealth();
        setInterval(checkHealth, 30000);

        async function renderModels() {
            let anyDownloading = false;
            try {
                const res = await fetch('/ui/models');
                if (!res.ok) return;
                const { checks } = await res.json();
                const ico = { ok: '✓', warning: '⚠', error: '✕' };
                modelsBar.innerHTML = '';

                const plainChip = (key, c, cls) => {
                    const el = document.createElement('span');
                    el.className = `model-chip ${cls}`;
                    el.title = `${c.label || key} — ${c.message || ''}`;
                    el.textContent = `${ico[cls] || '?'} ${c.label || key}`;
                    return el;
                };

                Object.entries(checks).forEach(([key, c]) => {
                    const cls = ['ok', 'warning', 'error'].includes(c.status) ? c.status : 'error';

                    // Modèle Ollama manquant : bouton qui lance le téléchargement,
                    // puis se transforme en barre de progression pendant le pull.
                    if (key === 'ollama' && c.downloadable) {
                        const dl = c.download || {};
                        if (dl.status === 'downloading') {
                            anyDownloading = true;
                            const pct = dl.percent != null ? dl.percent : 0;
                            const el = document.createElement('span');
                            el.className = 'model-chip downloading';
                            el.title = `${c.label} — ${dl.message || 'Téléchargement…'}`;
                            el.innerHTML = `
                                <span class="dl-top">
                                    <span class="ico">⬇</span>
                                    <span>${esc(c.label)}</span>
                                    <span class="progress-text">${pct}%</span>
                                </span>
                                <span class="progress-bar"><span style="width:${pct}%"></span></span>`;
                            modelsBar.appendChild(el);
                            return;
                        }
                        const btn = document.createElement('button');
                        btn.className = `model-chip btn${dl.status === 'error' ? ' error' : ''}`;
                        btn.title = (dl.status === 'error'
                            ? `Échec du téléchargement : ${dl.message || ''} — `
                            : '') + `Cliquer pour télécharger ${c.label}`;
                        btn.textContent = dl.status === 'error'
                            ? `⚠ Réessayer ${c.label}`
                            : `⬇ Télécharger ${c.label}`;
                        btn.addEventListener('click', async () => {
                            btn.disabled = true;
                            btn.textContent = 'Démarrage…';
                            try { await fetch('/ui/models/download', { method: 'POST' }); }
                            catch (e) { console.error(e); }
                            renderModels();
                        });
                        modelsBar.appendChild(btn);
                        return;
                    }

                    modelsBar.appendChild(plainChip(key, c, cls));
                });

                const refresh = document.createElement('button');
                refresh.className = 'model-refresh';
                refresh.title = 'Re-vérifier les modèles';
                refresh.textContent = '↻';
                refresh.addEventListener('click', renderModels);
                modelsBar.appendChild(refresh);
            } catch {
                modelsBar.innerHTML = '<span class="model-chip error"><span class="ico">✕</span> Statut indisponible</span>';
            }
            // Rafraîchissement rapide tant qu'un modèle est en cours de téléchargement.
            if (anyDownloading) setTimeout(renderModels, 1500);
        }
        renderModels();
        setInterval(renderModels, 30000);

        function esc(s) {
            const div = document.createElement('div');
            div.textContent = s == null ? '' : String(s);
            return div.innerHTML;
        }

        function renderSteps(reportedSteps, jobStatus) {
            const byStep = {};
            (reportedSteps || []).forEach(s => { byStep[s.step] = s; });

            let done = jobStatus === 'finished';
            let failed = jobStatus === 'failed';
            if ((reportedSteps || []).some(s => s.status === 'error')) failed = true;

            stepsContainer.innerHTML = '';

            let firstPending = false;
            STEP_ORDER.forEach(name => {
                const s = byStep[name];
                let css = 'pending';
                let icon = '';
                let message = 'En attente…';
                if (s) {
                    if (s.status === 'ok') { css = 'ok'; icon = '✓'; message = s.message || 'Terminé'; }
                    else if (s.status === 'error') { css = 'error-st'; icon = '✕'; message = ''; }
                    else if (s.status === 'running') { css = 'running'; icon = '…'; message = s.message || 'En cours…'; }
                    else { css = 'pending'; message = s.message || 'En attente…'; }
                } else if (done || failed || firstPending) {
                    css = 'pending';
                    message = 'En attente…';
                } else {
                    css = 'running';
                    icon = '…';
                    message = 'En cours…';
                    firstPending = true;
                }

                let errorHtml = (s && s.error) ? `<div class="error">${esc(s.error)}</div>` : '';
                const div = document.createElement('div');
                div.className = `step ${css}`;
                div.innerHTML = `
                    <span class="icon">${icon}</span>
                    <div class="body">
                        <div class="label">${esc(s ? s.label : STEP_LABELS[name])}</div>
                        <div class="message">${esc(message)}</div>
                        ${errorHtml}
                    </div>`;
                stepsContainer.appendChild(div);
            });
        }

        function renderResult(status) {
            const steps = status.steps || [];
            const result = status.result || {};
            resultTitle.textContent = status.status === 'failed'
                ? '❌ Échec de la transcription'
                : (result && result.success === false ? '❌ Échec de la transcription' : '✅ Transcription');
            renderSteps(steps, status.status);

            detailsContainer.innerHTML = '';
            if (status.status === 'failed') {
                const err = (steps.filter(s => s.status === 'error').pop() || {}).error || 'Erreur inconnue';
                detailsContainer.innerHTML = `
                    <div class="error-box">
                        <h3>Erreur</h3>
                        <p class="detail">${esc(err)}</p>
                        <p class="detail" style="font-size:0.85rem;color:#666;">
                            <button type="button" id="retry-btn" class="btn" style="margin-top:0.5rem;">Réessayer</button>
                        </p>
                    </div>`;
                const retryBtn = document.getElementById('retry-btn');
                if (retryBtn) retryBtn.addEventListener('click', () => form.requestSubmit());
                return;
            }

            if (result && result.success) {
                const title = result.title || '(aucun)';
                const customer = result.customer_name || 'Non identifié';
                const transcript = result.transcript || '';
                const ticketUrl = result.ticket_url || '';
                detailsContainer.innerHTML = `
                    <div class="success-box">
                        <h3>Résultat</h3>
                        <p class="detail"><strong>Ticket :</strong>
                            ${ticketUrl ? `<a href="${esc(ticketUrl)}" target="_blank" rel="noopener">#${esc(result.ticket_id)}</a>` : `#${esc(result.ticket_id)}`}
                        </p>
                        <p class="detail"><strong>Titre généré :</strong> ${esc(title)}</p>
                        <p class="detail"><strong>Client :</strong> ${esc(customer)}</p>
                        <p class="detail"><strong>Transcription :</strong></p>
                        <pre>${esc(transcript)}</pre>
                    </div>`;
            } else if (result && result.success === false) {
                detailsContainer.innerHTML = `<div class="error-box"><h3>Erreur</h3><pre>${esc(result.error || 'Erreur inconnue')}</pre></div>`;
            } else {
                detailsContainer.innerHTML = `<div class="error-box"><h3>Erreur</h3><pre>${esc(status.error || 'Échec inattendu du job.')}</pre></div>`;
            }
        }

        async function poll(jobId) {
            resultDiv.className = 'result active';
            resultTitle.textContent = '⏳ Traitement en cours…';
            renderSteps([], 'running');

            let attempts = 0;
            const maxAttempts = 600; // ~10 min
            while (attempts < maxAttempts) {
                await new Promise(r => setTimeout(r, 1200));
                let res;
                try {
                    res = await fetch(`/ui/status/${jobId}`);
                } catch {
                    continue;
                }
                if (!res.ok) continue;
                const status = await res.json();
                renderSteps(status.steps || [], status.status);

                if (status.status === 'finished' || status.status === 'failed') {
                    renderResult(status);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Lancer la transcription';
                    renderModels();
                    return;
                }
                attempts++;
            }
            resultTitle.textContent = '⏱️ Délai dépassé';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Lancer la transcription';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const ticketId = document.getElementById('ticket_id').value.trim();
            if (!ticketId) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Traitement en cours...';

            try {
                const res = await fetch('/ui/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket_id: parseInt(ticketId) })
                });
                const data = await res.json();
                if (!res.ok || !data.job_id) {
                    throw new Error(data.detail || 'Erreur inconnue');
                }
                await poll(data.job_id);
            } catch (err) {
                resultDiv.className = 'result active';
                resultTitle.textContent = '❌ Erreur';
                detailsContainer.innerHTML = `<div class="error-box"><h3>Erreur</h3><pre>${esc(err.message)}</pre></div>`;
                stepsContainer.innerHTML = '';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Lancer la transcription';
            }
        });
    </script>
</body>
</html>
