<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zammad Auto-Transcription{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: #2c3e50; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #666; font-size: 1.1rem; }
        .card { background: white; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #2c3e50; }
        input[type="number"] { width: 100%; padding: 0.75rem; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; transition: border-color 0.2s; }
        input[type="number"]:focus { outline: none; border-color: #3498db; }
        .btn { width: 100%; padding: 0.875rem; background: #3498db; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #2980b9; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .result { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; display: none; }
        .result.success { background: #e8f8f5; border: 1px solid #27ae60; display: block; }
        .result.error { background: #fdf2f2; border: 1px solid #e74c3c; display: block; }
        .result.loading { background: #ebf5fb; border: 1px solid #3498db; display: block; }
        .result h3 { margin-bottom: 0.75rem; }
        .result.success h3 { color: #27ae60; }
        .result.error h3 { color: #e74c3c; }
        .result.loading h3 { color: #3498db; }
        .result pre { background: #f8f9fa; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.9rem; max-height: 300px; }
        .health { text-align: right; margin-top: 2rem; font-size: 0.85rem; color: #888; }
        .health span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem; vertical-align: middle; }
        .health.ok span { background: #27ae60; }
        .health.error span { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ Zammad Auto-Transcription</h1>
            <p class="subtitle">Transcription manuelle de messages vocaux</p>
        </header>

        <div class="card">
            <form id="transcribe-form" novalidate>
                <div class="form-group">
                    <label for="ticket_id">Numéro de ticket Zammad</label>
                    <input type="number" id="ticket_id" name="ticket_id" min="1" required placeholder="ex: 1234" autocomplete="off">
                </div>
                <button type="submit" class="btn" id="submit-btn">Lancer la transcription</button>
            </form>

            <div id="result" class="result"></div>
        </div>

        <div class="health">
            API: <span id="health-status" class="error"></span><span id="health-text">Vérification...</span>
        </div>
    </div>

    <script>
        const form = document.getElementById('transcribe-form');
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submit-btn');
        const healthSpan = document.getElementById('health-status');
        const healthText = document.getElementById('health-text');

        async function checkHealth() {
            try {
                const res = await fetch('/health');
                if (res.ok) {
                    healthSpan.className = 'ok';
                    healthText.textContent = 'Opérationnel';
                } else {
                    throw new Error('API down');
                }
            } catch {
                healthSpan.className = 'error';
                healthText.textContent = 'Indisponible';
            }
        }

        checkHealth();
        setInterval(checkHealth, 30000);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const ticketId = document.getElementById('ticket_id').value.trim();
            if (!ticketId) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Traitement en cours...';

            resultDiv.className = 'result loading';
            resultDiv.innerHTML = '<h3>⏳ Traitement</h3><p>Transcription en cours, cela peut prendre quelques secondes...</p>';

            try {
                const res = await fetch('/ui/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket_id: parseInt(ticketId) })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Transcription réussie</h3>
                        <p><strong>Ticket :</strong> #${data.ticket_id}</p>
                        <p><strong>Titre généré :</strong> ${data.title}</p>
                        <p><strong>Client :</strong> ${data.customer_name || 'Non identifié'}</p>
                        <p><strong>Transcription :</strong></p>
                        <pre>${data.transcript}</pre>
                    `;
                } else {
                    throw new Error(data.detail || 'Erreur inconnue');
                }
            } catch (err) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h3>❌ Erreur</h3><p>${err.message}</p>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Lancer la transcription';
            }
        });
    </script>
</body>
</html>
